<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Clienți - Pizzerie</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="customer-display-body">
    <header class="glass-panel main-header">
        <h1>Status Comenzi</h1>
    </header>

    <main class="glass-panel customer-area">
        <div class="display-columns">
            <div class="column">
                <h2>În Preparare</h2>
                <div id="in-preparare-container" class="orders-list">
                    <p>Momentan nu sunt comenzi în preparare.</p>
                </div>
            </div>
            <div class="column">
                <h2>Gata de Ridicare</h2>
                <div id="finalizate-container" class="orders-list">
                    <p>Momentan nu sunt comenzi gata.</p>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/supabase.js"></script>
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/customer.js"></script>

    <script>
        // Funcție utilitară pentru a calcula minutele rămase din Timestamp
        window.calculateRemainingTime = function(timestamp) {
            if (!timestamp) return "?";
            const now = Date.now();
            const diffMs = timestamp - now;
            const diffMins = Math.ceil(diffMs / 60000);
            return diffMins > 0 ? diffMins : 0; // Nu afișăm numere negative
        };

        // Aici va veni logica de randare reală după ce Supabase furnizează datele.
        // Pentru moment, lăsăm un comentariu pentru implementare.
        /*
        function renderCustomerDisplay(orders) {
            ...
            const timeRemaining = calculateRemainingTime(order.timp_asteptare);
            element.innerText = `~ ${timeRemaining} min`;
            ...
        }
        */
    </script>
</body>
</html>
