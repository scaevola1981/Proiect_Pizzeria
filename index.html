<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pizzerie - Comandă Online</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/img/logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <header class="bella-roma-hero">
        <div class="hero-overlay">
            <h1 class="hero-title">BELLA ROMA</h1>
            <p class="hero-subtitle">PUB & PIZZERIE</p>
        </div>
    </header>

    <div class="table-info-bar">
        <div id="table-info">Masa: <span id="masa-id" style="font-weight: 800;">Scanați QR</span></div>
    </div>

    <div class="content-wrapper">
        <main class="glass-panel products-area">
            <!-- Search & Tabs -->
            <div class="menu-controls" style="margin-bottom: 25px;">
                <div class="search-bar" style="margin-bottom: 15px; position: relative;">
                    <i class="fas fa-search" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #666;"></i>
                    <input type="text" id="search-input" placeholder="Caută" style="width: 100%; padding: 12px 15px 12px 40px; border-radius: 8px; border: 1px solid #ddd; font-size: 1rem; box-sizing: border-box;">
                </div>
                <div class="menu-tabs" style="display: flex; background: rgba(255, 255, 255, 0.15); border-radius: 8px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.3);">
                    <button id="tab-bar" class="tab-btn" style="flex: 1; padding: 12px; border: none; background: transparent; color: #fff; font-weight: bold; cursor: pointer; transition: all 0.3s; border-right: 1px solid rgba(255, 255, 255, 0.2);">Meniu Bar</button>
                    <button id="tab-restaurant" class="tab-btn active" style="flex: 1; padding: 12px; border: none; background: #fff; color: #333; font-weight: bold; cursor: pointer; transition: all 0.3s;">Meniu Restaurant</button>
                </div>
            </div>

            <div id="produse-container" class="products-grid">
                <p style="text-align:center; width:100%;">Meniul se încarcă...</p>
            </div>
        </main>

        <aside class="glass-panel cart-area">
            <h2 id="cart-title">Coșul meu</h2>
            <div id="cart-items">
                <p class="empty-cart">Nu ati comandat inca nimic</p>
            </div>
            <div class="cart-summary">
                <h3>Total: <span id="cart-total">0.00</span> Lei</h3>
                <button id="btn-trimite-comanda" disabled>Trimite Comanda</button>
            </div>
        </aside>
    </div>

    <!-- Modal Personalizare Produs -->
    <div id="customize-modal" class="modal hidden">
        <div style="max-width: 500px; width: 90%; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; padding: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); text-align: center;">
            <h2 id="customize-product-name" style="color: #f5b041; margin-bottom: 10px;">Personalizează</h2>
            <p style="color: rgba(255,255,255,0.7); margin-bottom: 20px;">Dorești să scoți un ingredient sau ai vreo alergie? Scrie mai
                jos:</p>
            <textarea id="customize-notes" rows="3" placeholder="ex: fără ceapă, extra sos, alergic la alune..."
                class="modern-input" style="margin-bottom: 20px; resize: none;"></textarea>
            <div style="display: flex; gap: 10px;">
                <button class="btn-secondary" onclick="window.closeCustomizeModal()" style="border-radius: 10px; padding: 12px;">Anulează</button>
                <button onclick="window.confirmCustomizeAndAdd()" style="border-radius: 10px; padding: 12px; font-weight: bold;">Alegerea mea</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/supabase.js"></script>
    <script type="module" src="js/app.js"></script>
</body>

</html>
