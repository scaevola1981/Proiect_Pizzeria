<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Bucătărie - Pizzerie</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="glass-panel main-header">
        <h1>Bucătărie - Live Orders</h1>
    </header>

    <main class="glass-panel kitchen-area">
        <div id="comenzi-active-container" class="orders-grid">
            <!-- Comenzile vor apărea aici -->
            <p>Fără comenzi active momentan.</p>
        </div>
    </main>

    <!-- Modal pentru acceptarea comenzii și setarea timpului -->
    <div id="accept-modal" class="modal hidden">
        <div class="glass-panel modal-content">
            <h2>Acceptă Comanda</h2>
            <p>Selectează ora de finalizare:</p>
            <select id="timp-estimat" class="glass-panel" style="width: 100%; margin-bottom: 15px; font-weight:bold;"></select>
            <div class="modal-actions">
                <button id="btn-confirm-accept">Confirmă</button>
                <button id="btn-cancel-accept" class="btn-secondary">Anulează</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/supabase.js"></script>
    <script type="module" src="js/app.js"></script>
    
    <script>
        // Logica pentru Bucătărie (Intervale rotunjite la 30 minute)
        function generateTimeIntervals() {
            const select = document.getElementById('timp-estimat');
            select.innerHTML = '';
            
            const now = new Date();
            let currentMinutes = now.getMinutes();
            let currentHours = now.getHours();
            
            // Rotunjire la următorul interval de 30 min
            if (currentMinutes < 30) {
                currentMinutes = 30;
            } else {
                currentMinutes = 0;
                currentHours += 1;
            }
            
            // Generăm 5 opțiuni (următoarele 2.5 ore)
            let baseTime = new Date(now);
            baseTime.setHours(currentHours, currentMinutes, 0, 0);
            
            for (let i = 0; i < 5; i++) {
                const optionTime = new Date(baseTime.getTime() + i * 30 * 60000);
                const hrs = optionTime.getHours().toString().padStart(2, '0');
                const mins = optionTime.getMinutes().toString().padStart(2, '0');
                
                const option = document.createElement('option');
                option.value = optionTime.getTime(); // Salvează Timestamp-ul absolut
                option.innerText = `${hrs}:${mins}`;
                select.appendChild(option);
            }
        }
        
        // Deschidere modal
        let currentOrderIdToAccept = null;
        window.openAcceptModal = function(orderId) {
            currentOrderIdToAccept = orderId;
            generateTimeIntervals();
            document.getElementById('accept-modal').classList.remove('hidden');
        };
        
        document.getElementById('btn-cancel-accept').addEventListener('click', () => {
            document.getElementById('accept-modal').classList.add('hidden');
        });
        
        document.getElementById('btn-confirm-accept').addEventListener('click', () => {
            const timestamp = parseInt(document.getElementById('timp-estimat').value);
            if (currentOrderIdToAccept) {
                // Va apela funcția schelet din supabase.js
                window.updateOrderStatus(currentOrderIdToAccept, 'in_preparare', timestamp);
                document.getElementById('accept-modal').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
