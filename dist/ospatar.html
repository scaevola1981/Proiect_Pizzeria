<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bella Roma - Panou Ospătar</title>
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com 'unsafe-inline'; style-src 'self' https://cdnjs.cloudflare.com 'unsafe-inline'; font-src https://cdnjs.cloudflare.com; img-src 'self' https: data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co;">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="apple-touch-icon" href="/img/icon.png">
    <link rel="apple-touch-icon-precomposed" href="/img/icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Ospătar Bella">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest-ospatar.json">
  <script type="module" crossorigin src="/assets/ospatar-D4PRV068.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/supabase-esk-4nyX.js">
  <link rel="modulepreload" crossorigin href="/assets/security-Bv09CpAF.js">
  <link rel="stylesheet" crossorigin href="/assets/supabase-DN60NlFN.css">
</head>

<body>
    <header class="bella-roma-hero" style="height: 100px; margin-bottom: 15px; position: relative;">
        <button onclick="window.location.href='receptie.html'"
            style="position: absolute; top: 12px; left: 12px; z-index: 10; background: rgba(15, 23, 42, 0.85); color: #f5b041; border: 1px solid #f5b041; padding: 7px 14px; border-radius: 10px; font-weight: bold; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 6px;">
            <i class="fas fa-arrow-left"></i> Recepție
        </button>
        <div class="hero-overlay" style="display: flex; flex-direction: column; justify-content: center; align-items: center;">
            <h1 class="hero-title" style="font-size: 1.8rem; margin: 0;">BELLA ROMA</h1>
            <p class="hero-subtitle" style="font-size: 0.95rem; margin: 0; color: #2ecc71; font-weight: bold;">
                <i class="fas fa-user-tie"></i> PANOU OSPĂTAR TABLETĂ
            </p>
        </div>
    </header>

    <!-- Selector Rapid Masă + Persoană (Imediat după Alege Masa) -->
    <div class="glass-panel" style="margin-bottom: 20px; padding: 18px;">
        <!-- Pasul 1: Alege Masa -->
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 12px;">
            <label style="color: #f5b041; font-weight: bold; font-size: 1.15rem; display: flex; align-items: center; gap: 8px;">
                <i class="fas fa-utensils"></i> 1. Alege Masa:
            </label>
            <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                <div id="ospatar-active-table-badge" style="background: #2ecc71; color: #1e293b; padding: 6px 16px; border-radius: 20px; font-weight: 800; font-size: 1rem; box-shadow: 0 0 15px rgba(46, 204, 113, 0.4);">
                    Masa 1 (Liberă)
                </div>
                <div id="ospatar-free-table-btn-container"></div>
            </div>
        </div>

        <!-- Grid 3 pe latime (3 columns) pentru Mese -->
        <div id="table-chips-grid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; margin-bottom: 20px;">
            <!-- Mesele vor fi generate dinamic -->
        </div>

        <!-- Pasul 2: Adaugi preparatele pentru (Persoană) -->
        <div style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.15);">
            <label style="color: #f5b041; font-size: 1.05rem; font-weight: bold; margin-bottom: 12px; display: flex; align-items: center; gap: 8px;">
                <i class="fas fa-user-friends"></i> 2. Adaugi preparatele pentru:
            </label>

            <!-- Pastile Persoane -->
            <div id="person-chips-container" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; width: 100%;">
                <button type="button" class="person-chip active" data-person="Masa" onclick="window.selectPersonChip(this, 'Masa')"
                    style="grid-column: 1 / -1; padding: 12px; border-radius: 12px; border: 1px solid #f5b041; background: #f5b041; color: #1e293b; font-weight: bold; font-size: 1rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px;">
                    👥 Comandă Împreună (Masa)
                </button>
                <button type="button" class="person-chip" data-person="Persoana 1" onclick="window.selectPersonChip(this, 'Persoana 1')"
                    style="padding: 12px 8px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: white; font-weight: 500; font-size: 0.95rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px;">
                    👤 Persoana 1
                </button>
                <button type="button" class="person-chip" data-person="Persoana 2" onclick="window.selectPersonChip(this, 'Persoana 2')"
                    style="padding: 12px 8px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: white; font-weight: 500; font-size: 0.95rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px;">
                    👤 Persoana 2
                </button>
                <button type="button" class="person-chip" data-person="Persoana 3" onclick="window.selectPersonChip(this, 'Persoana 3')"
                    style="padding: 12px 8px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: white; font-weight: 500; font-size: 0.95rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px;">
                    👤 Persoana 3
                </button>
                <button type="button" class="person-chip" data-person="Persoana 4" onclick="window.selectPersonChip(this, 'Persoana 4')"
                    style="padding: 12px 8px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: white; font-weight: 500; font-size: 0.95rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px;">
                    👤 Persoana 4
                </button>
                <button type="button" class="person-chip" data-person="Persoana 5" onclick="window.selectPersonChip(this, 'Persoana 5')"
                    style="padding: 12px 8px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: white; font-weight: 500; font-size: 0.95rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px;">
                    👤 Persoana 5
                </button>
                <button type="button" class="person-chip" data-person="Persoana 6" onclick="window.selectPersonChip(this, 'Persoana 6')"
                    style="padding: 12px 8px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: white; font-weight: 500; font-size: 0.95rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px;">
                    👤 Persoana 6
                </button>
            </div>
        </div>
    </div>

    <div class="content-wrapper">
        <main class="glass-panel products-area">
            <!-- Header Sticky Navigație & Căutare Meniu -->
            <div class="menu-controls"
                style="position: sticky; top: 0; z-index: 100; background: rgba(15, 23, 42, 0.96); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); padding: 12px 14px 10px 14px; margin-top: -15px; margin-left: -15px; margin-right: -15px; margin-bottom: 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.15); border-radius: 16px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);">
                
                <!-- Search Bar -->
                <div class="search-bar" style="margin-bottom: 10px; position: relative;">
                    <i class="fas fa-search" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #888;"></i>
                    <input type="text" id="search-input" placeholder="Caută preparat sau băutură..."
                        style="width: 100%; padding: 11px 15px 11px 40px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: #fff; font-size: 0.95rem; box-sizing: border-box; outline: none;">
                </div>

                <!-- Tabs (Meniu Restaurant vs Meniu Bar) -->
                <div class="menu-tabs"
                    style="display: flex; background: rgba(255, 255, 255, 0.1); border-radius: 10px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.15);">
                    <button id="tab-restaurant" class="tab-btn active" onclick="window.setTab('restaurant');"
                        style="flex: 1; padding: 11px; border: none; background: #fff; color: #1e293b; font-weight: 800; font-size: 0.95rem; cursor: pointer; transition: all 0.25s; border-right: 1px solid rgba(255, 255, 255, 0.2);">
                        🍕 Meniu Restaurant
                    </button>
                    <button id="tab-bar" class="tab-btn" onclick="window.setTab('bar');"
                        style="flex: 1; padding: 11px; border: none; background: transparent; color: #fff; font-weight: 800; font-size: 0.95rem; cursor: pointer; transition: all 0.25s;">
                        🍹 Meniu Bar
                    </button>
                </div>

                <!-- Subcategorii Nav Orizontal -->
                <div id="subcategory-nav" class="subcategory-nav-bar hidden">
                    <!-- Se va umple dinamic prin JS -->
                </div>
            </div>

            <div id="produse-container" class="products-container" style="padding-bottom: 90px;">
                <p style="text-align:center; width:100%;">Meniul se încarcă...</p>
            </div>
        </main>
    </div>

    <!-- Modal Coș Comandă Ospătar (Afișat la apăsarea 'Vezi Coș') -->
    <div id="cart-modal"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 10000; justify-content: center; align-items: center; padding: 15px; box-sizing: border-box;">
        <div class="glass-panel"
            style="width: 100%; max-width: 520px; max-height: 88vh; display: flex; flex-direction: column; background: #0f172a; border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.85); overflow: hidden; animation: fadeIn 0.25s ease;">
            
            <!-- Header Modal -->
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04);">
                <h2 style="margin: 0; font-size: 1.25rem; color: #f5b041; display: flex; align-items: center; gap: 8px;">
                    <i class="fas fa-shopping-cart"></i> Comandă <span id="cart-table-display" style="color: #2ecc71; margin-left: 5px;">Masa 1</span>
                </h2>
                <button onclick="window.closeCartModal()"
                    style="background: rgba(255,255,255,0.12); border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; transition: background 0.2s;">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <!-- Listă Produse (Scrollabilă) -->
            <div id="cart-items" style="padding: 15px 20px; overflow-y: auto; flex: 1; min-height: 160px; max-height: 50vh;">
                <p class="empty-cart">Alegeți preparatele pentru masa selectată.</p>
            </div>

            <!-- Footer Modal cu Total și Buton de Trimitere -->
            <div style="padding: 16px 20px; border-top: 1px solid rgba(255,255,255,0.12); background: rgba(15, 23, 42, 0.98);">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
                    <span style="color: #aaa; font-size: 1rem; font-weight: 600;">Total de plată:</span>
                    <span style="color: #2ecc71; font-size: 1.45rem; font-weight: 800;"><span id="cart-total">0.00</span> Lei</span>
                </div>
                <button id="btn-trimite-comanda-ospatar" onclick="window.sendWaiterOrder()" disabled
                    style="background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%); color: #1e293b; font-weight: 800; font-size: 1.15rem; padding: 15px; border-radius: 14px; box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4); border: none; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.2s;">
                    <i class="fas fa-paper-plane"></i> Trimite Comanda la Recepție
                </button>
            </div>

        </div>
    </div>

    <!-- Bara Plutitoare Fixă de Trimitere Rapidă Comandă (Ospătar Tabletă) -->
    <div id="ospatar-floating-cart-bar"
        style="position: fixed; bottom: 15px; right: 15px; left: 15px; z-index: 9990; background: rgba(15, 23, 42, 0.96); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 20px; padding: 10px 18px; box-shadow: 0 10px 35px rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;">
        <div style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap;">
            <span style="color: #2ecc71; font-weight: 800; font-size: 1rem; background: rgba(46, 204, 113, 0.15); padding: 6px 12px; border-radius: 12px; border: 1px solid rgba(46, 204, 113, 0.3);">
                📍 Masa <span id="quick-bar-masa">1</span>
            </span>
            <span style="color: #fff; font-weight: bold; font-size: 0.95rem;">
                🛒 <span id="quick-bar-count">0</span> produse
            </span>
            <span style="color: #f5b041; font-weight: 800; font-size: 1.1rem;">
                Total: <span id="quick-bar-total">0.00</span> Lei
            </span>
        </div>
        <div style="display: flex; align-items: center; gap: 10px;">
            <button type="button" onclick="window.openCartModal()"
                style="background: rgba(255, 255, 255, 0.12); color: white; border: 1px solid rgba(255,255,255,0.25); padding: 11px 16px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 0.95rem; display: flex; align-items: center; gap: 8px; transition: background 0.2s;">
                <i class="fas fa-list"></i> Vezi Coș
            </button>
            <button id="quick-btn-trimite" type="button" onclick="window.sendWaiterOrder()" disabled
                style="background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%); color: #1e293b; border: none; padding: 12px 20px; border-radius: 12px; font-weight: 800; font-size: 1rem; cursor: pointer; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4); transition: all 0.2s;">
                <i class="fas fa-paper-plane"></i> Trimite la Recepție
            </button>
        </div>
    </div>

    <!-- Notificări Custom -->
    <div id="notification-container"
        style="position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px;">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</body>

</html>
